<!doctype html>
<!-- class="dark" = pre-paint default (design system: dark-first). The inline
     script below corrects it before first paint for light/system users. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Kubernetes Manager</title>

    <script>
      // Pre-paint theme bootstrap — mirrors next-themes exactly
      // (storageKey "theme", attribute "class", defaultTheme "dark"),
      // so there is no light/dark flash before React mounts.
      (function () {
        try {
          var stored = localStorage.getItem("theme") || "dark";
          var dark =
            stored === "dark" ||
            (stored === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
