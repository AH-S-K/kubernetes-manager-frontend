server {
    listen 80;
    server_name localhost;

    # Automatic Gzip compression at the Nginx level
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Critical for React: prevent 404 errors when refreshing pages
        try_files $uri $uri/ /index.html;
    }

    # Long-term caching for hashed files (built chunks)
    location ~* \.(js|css|woff2?|svg|png|jpg|ico)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://django-api.django-k8s-manager.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}